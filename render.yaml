services:
  - type: web
    name: heliowatt
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: SEED
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
